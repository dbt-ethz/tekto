<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tekto TestBench</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0b0b0b; color: #cccccc; font-family: 'IBM Plex Mono', 'Menlo', monospace; }

    /* ── Top bar ──────────────────────────────────────────────────── */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 36px; z-index: 1000;
      display: flex; align-items: center; gap: 10px; padding: 0 12px;
      background: #1e1e1e; border-bottom: 1px solid #303030;
      font-size: 12px;
    }
    #topbar .brand {
      font-weight: 600; color: #ffffff; font-size: 13px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    #topbar .sep { width: 1px; height: 16px; background: #303030; }
    #topbar .spacer { flex: 1 1 auto; }
    #topbar select, #topbar button {
      background: #141414; color: #cccccc; border: 1px solid #444444;
      border-radius: 3px; padding: 4px 8px; font-size: 11px;
      font-family: inherit; outline: none; cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    #topbar select:hover, #topbar button:hover { border-color: #ffffff; }
    #topbar button:disabled, #topbar button[hidden] { display: none; }
    #topbar #app-menus button { border: 0; }
    #topbar #app-menus:empty, #topbar #app-menus:empty + .sep, body.embed #app-menus, body.embed #menu-sep { display: none; }
    #topbar .label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: #a8a8a8;
    }
    #topbar .group {
      display: inline-flex; align-items: center; gap: 6px;
    }
    #topbar a.link { color: #a8a8a8; text-decoration: none; font-size: 11px; }
    #topbar a.link:hover { color: #ffffff; }
    #topbar a.link[hidden] { display: none; }

    #app { position: absolute; left: 0; top: 36px; right: 0; bottom: 0; }

    /* ?embed: shown inside a docs page, which picked the page and links its docs and source:
       only the view controls stay, and no bar at all for a page that brings its own. */
    body.embed #topbar .brand, body.embed #topbar .brand + .sep, body.embed #page-group,
    body.embed #topbar a.link { display: none; }
    body.embed.own-bar #topbar { display: none; }
    body.embed.own-bar #app { top: 0; }
  </style>
</head>
<body>
  <header id="topbar">
    <span class="brand">&#x2B21; Tekto</span>
    <span class="sep"></span>
    <span class="group" id="page-group">
      <span class="label">Page</span>
      <select id="page-chooser" title="Switch demo"></select>
    </span>
    <a id="docs-link" class="link" target="_blank" rel="noopener" title="What this page shows, in the docs" hidden>Docs</a>
    <a id="source-link" class="link" target="_blank" rel="noopener" title="This page's code: one function">Source</a>

    <!-- The running app's menu bar (File, Edit, View, its own): each app mounts it here. -->
    <span class="sep" id="menu-sep"></span>
    <span id="app-menus" data-tekto-menu-slot></span>

    <span class="spacer"></span>
  </header>

  <div id="app"></div>

  <script type="module" src="./testbench.ts"></script>
</body>
</html>
